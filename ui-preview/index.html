<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lineage 2 Valheim — Inventory UI Preview</title>
  <style>
    :root { color-scheme: dark; --gold:#aa8350; --gold-light:#d1ad72; --line:#725734; --muted:#87908c; --panel:#121719; --slot:#202528; --black:#090d0e; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:22px; color:#ddd4bf; font:14px/1.35 Georgia,serif; background:radial-gradient(ellipse at 52% 2%,#445359 0,#1a292b 38%,#0b1417 72%,#080e10 100%); }
    .preview-wrap { width:min(1330px,100%); }
    .preview-note { margin:0 0 10px; font:12px/1.4 Arial,sans-serif; color:#b6c1bc; letter-spacing:.04em; }
    .window { position:relative; height:min(820px,calc(100vh - 72px)); min-height:680px; display:grid; grid-template-rows:51px minmax(0,1fr); overflow:hidden; border:2px solid #957345; border-radius:8px; background:linear-gradient(145deg,#1d2222,#0d1112 72%); box-shadow:0 24px 60px #000b, inset 0 0 0 2px #171b1b, inset 0 0 0 3px #654d30; }
    .window::before,.window::after { content:'◆'; position:absolute; z-index:4; top:1px; color:#b58c57; font-size:26px; text-shadow:0 1px 2px black; }
    .window::before { left:9px; } .window::after { right:9px; }
    .titlebar { display:flex; align-items:center; justify-content:center; border-bottom:2px solid #705534; background:linear-gradient(#242522,#121616); box-shadow:inset 0 3px #ad8754, 0 2px 9px #0008; }
    .titlebar::before,.titlebar::after { content:'────◇────'; color:#80623a; letter-spacing:2px; padding:0 25px; }
    .titlebar h1 { margin:0; color:#dfbd81; font-weight:400; letter-spacing:.17em; font-size:23px; text-shadow:0 2px 3px black; }
    .close { position:absolute; right:20px; top:9px; width:31px; height:31px; border:1px solid #9b7849; border-radius:3px; background:linear-gradient(#2d302e,#121718); color:#dfbd81; font:20px Arial,sans-serif; cursor:pointer; }
    .body { min-height:0; display:grid; grid-template-columns:minmax(365px,39%) minmax(0,61%); }
    .character-pane,.inventory-pane { min-width:0; min-height:0; position:relative; padding:18px 18px 16px; }
    .character-pane { border-right:2px solid #8c6a3f; background:radial-gradient(ellipse at 51% 49%,#323332 0,#171c1d 48%,#0b1112 100%); }
    .inventory-pane { background:linear-gradient(125deg,#151a1b,#0d1213 60%); }
    .section-title { margin:0 0 14px; color:#d9b37b; font-size:17px; font-weight:400; letter-spacing:.13em; text-shadow:0 2px 3px black; }
    .character-area { height:calc(100% - 110px); min-height:460px; position:relative; display:grid; grid-template-columns:62px minmax(0,1fr) 62px; column-gap:6px; }
    .slots-column { z-index:2; display:flex; flex-direction:column; justify-content:space-between; align-items:stretch; gap:6px; }
    .slots-column .equip-slot { width:100%; aspect-ratio:1 / 1; flex:0 0 auto; }
    .figure-stage { position:relative; overflow:hidden; min-height:0; display:grid; place-items:end center; border-bottom:1px solid #6c5639; background:radial-gradient(ellipse at 50% 67%,#41413c55,transparent 62%); }
    .figure-stage::before { content:''; position:absolute; bottom:0; width:85%; height:22px; border-radius:50%; background:#0009; filter:blur(8px); }
    .figure-stage img { position:relative; z-index:1; height:98%; max-width:100%; width:auto; object-fit:contain; object-position:bottom; filter:drop-shadow(0 10px 11px #000b); }
    .equip-slot { position:relative; min-height:0; display:grid; place-items:center; border:1px solid #6c593b; border-radius:2px; background:linear-gradient(145deg,#303437,#1a1f21 70%); box-shadow:inset 0 0 0 2px #111719,inset 0 1px #b391604d,0 2px 4px #0008; cursor:default; }
    .equip-slot.drop-ok { border-color:#dfbd81; box-shadow:0 0 12px #caa36377,inset 0 0 0 2px #111719; }
    .equip-slot::before { content:''; position:absolute; inset:3px; background:var(--slot-art) center/contain no-repeat; filter:grayscale(1) brightness(1.5) contrast(1.1); opacity:.72; pointer-events:none; }
    .equip-slot.filled::before { opacity:.25; }
    .equip-slot .glyph { visibility:hidden; }
    .equip-slot .equipped-icon { position:absolute; z-index:1; width:58%; height:58%; object-fit:contain; color:#e1bd83; fill:none; filter:drop-shadow(0 2px 2px #000); }
    .gear-row { height:80px; display:flex; justify-content:center; gap:9px; align-items:end; padding-top:9px; }
    .gear-row .equip-slot { width:67px; height:67px; }
    .gear-row .equip-slot .glyph { width:50%; height:50%; }
    .inventory-content { height:100%; display:grid; grid-template-rows:auto minmax(0,1fr) auto 48px; gap:11px; }
    .inventory-content .section-title { margin:0; }
    .item-grid { align-content:start; display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); grid-template-rows:repeat(4,auto); gap:5px; min-height:0; }
    .item-cell { position:relative; min-width:0; min-height:0; aspect-ratio:1; display:grid; place-items:center; border:1px solid #594d38; background:linear-gradient(145deg,#262b2d,#171c1e 75%); box-shadow:inset 0 0 0 2px #0d1213; cursor:pointer; }
    .item-cell:hover { border-color:#c49a5d; }
    .item-cell.selected { border:2px solid #e3ba71; box-shadow:0 0 12px #d9a95166,inset 0 0 0 2px #0d1213; }
    .item-cell.dragging { opacity:.42; }
    .item-symbol { width:58%; height:58%; color:#c7a879; fill:none; filter:drop-shadow(0 2px 2px #000); }
    .item-cell[data-kind="berries"] .item-symbol { color:#c34b46; }
    .item-cell[data-kind="torch"] .item-symbol { color:#e9a751; }
    .item-cell[data-kind="sword"] .item-symbol { color:#c7c9bb; }
    .stack { position:absolute; right:5px; bottom:2px; color:#f0e8d3; font:12px Arial,sans-serif; text-shadow:1px 1px 2px black; }
    .details { min-height:142px; display:grid; grid-template-columns:130px minmax(0,1fr); gap:18px; padding:14px; border:1px solid #82623c; border-radius:3px; box-shadow:inset 0 0 0 3px #101617; background:linear-gradient(120deg,#202322,#111617); }
    .detail-icon { display:grid; place-items:center; min-height:112px; border:1px solid #8c6b43; background:radial-gradient(#323331,#171b1b 75%); }
    .detail-icon svg { width:65px; height:65px; color:#e3a35d; fill:none; }
    .detail-body h3 { margin:0 0 6px; color:#e7c58d; font-size:26px; font-weight:400; }
    .detail-body p { margin:0 0 7px; color:#c5c1b6; font-size:14px; }
    .detail-meta { display:flex; gap:18px; margin-top:11px; padding-top:8px; border-top:1px solid #65543a; color:#afa99c; font-size:13px; }
    .footer { display:flex; gap:22px; align-items:center; min-width:0; }
    .items-count { white-space:nowrap; color:#c6bdab; font-size:15px; }
    .weight { min-width:150px; flex:1; max-width:225px; color:#c6bdab; font-size:13px; }
    .weight-bar { height:10px; margin-top:3px; border:1px solid #80643c; background:#090e0e; }
    .weight-bar span { display:block; width:10%; height:100%; background:linear-gradient(90deg,#bc8743,#e4b965); }
    .actions { margin-left:auto; display:flex; gap:9px; }
    .action { min-width:96px; height:38px; border:1px solid #b58a50; border-radius:2px; color:#e9c78d; background:linear-gradient(#30312b,#121617); box-shadow:inset 0 0 0 3px #171b1b,0 2px 5px #0009; font:16px Georgia,serif; cursor:pointer; }
    .action:hover { background:linear-gradient(#4a4233,#1b1d1b); }
    .action:disabled { opacity:.47; cursor:default; }
    .hint { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); padding:7px 13px; border:1px solid #856842; border-radius:3px; background:#101616ed; color:#dcc59e; font:12px Arial,sans-serif; opacity:0; pointer-events:none; transition:opacity .2s; }
    .hint.show { opacity:1; }
    @media (max-width:900px) { body { padding:8px; } .window { min-height:680px; } .body { grid-template-columns:37% 63%; } .character-pane,.inventory-pane { padding:12px; } .character-area { grid-template-columns:48px minmax(0,1fr) 48px; } .details { grid-template-columns:90px 1fr; } .gear-row .equip-slot { width:55px; height:55px; } .titlebar::before,.titlebar::after { display:none; } }
  </style>
</head>

  <script>
    const use = (name, cssClass='glyph') => `<svg class="${cssClass}" viewBox="0 0 32 32" aria-hidden="true"><use href="#${name}"></use></svg>`;
    const slots = {
      armor:[['Head','helmet'],['Chest','chest'],['Legs','legs'],['Gloves','gloves'],['Boots','boots'],['Back','cloak']],
      jewelry:[['Neck','necklace'],['Earring','earring'],['Earring','earring'],['Ring','ring'],['Ring','ring'],['Bracelet','bracelet']],
      weapon:[['Weapon','sword'],['Offhand','shield'],['Ammo','ammo']]
    };
    const items = [
      {name:'Wood',kind:'wood',stack:54,weight:'1.0',description:'Sturdy timber for building and crafting.'},
      {name:'Raspberries',kind:'berries',stack:18,weight:'0.1',description:'Sweet berries gathered in the meadows.'},
      {name:'Torch',kind:'torch',stack:3,weight:'1.5',description:'A simple wooden torch. Lights the way and keeps the darkness at bay.',fits:['Weapon','Offhand']},
      {name:'Sword',kind:'sword',stack:1,weight:'0.8',description:'A simple blade for close combat.',fits:['Weapon']}
    ];
    let selected = items[2]; let dragged = null; const equipped = new Map();
    function showHint(message) { const el=document.getElementById('hint'); el.textContent=message; el.classList.add('show'); clearTimeout(showHint.timer); showHint.timer=setTimeout(()=>el.classList.remove('show'),2400); }
    function makeSlot([label,glyph], index) {
      const el=document.createElement('div'); el.className='equip-slot'; el.title=label; el.dataset.slot=label; el.dataset.index=index; el.dataset.icon=glyph; el.style.setProperty('--slot-art',`url('assets/${glyph}-slot-v1.png')`); el.innerHTML=use(glyph);
      el.addEventListener('dragover',e=>{ if(dragged?.fits?.includes(label)){e.preventDefault();el.classList.add('drop-ok');} });
      el.addEventListener('dragleave',()=>el.classList.remove('drop-ok'));
      el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drop-ok'); if(dragged) equip(dragged,el); dragged=null;});
      el.addEventListener('click',()=>{ const item=equipped.get(el); if(item){equipped.delete(el); render(); showHint(`${item.name} unequipped`);} });
      return el;
    }
    for(const [id,collection] of [['armor-slots',slots.armor],['jewelry-slots',slots.jewelry],['weapon-slots',slots.weapon]]) {
      document.getElementById(id).append(...collection.map(makeSlot));
    }
    function equip(item, target) {
      if(!item.fits?.includes(target.dataset.slot)){showHint(`${item.name} cannot go in ${target.dataset.slot}`);return;}
      for(const [slot,old] of equipped) if(old===item) equipped.delete(slot);
      equipped.set(target,item); render(); showHint(`${item.name} equipped`);
    }
    function updateDetails() {
      const display=selected||items[2];document.getElementById('detail-icon').innerHTML=use(display.kind,'item-symbol');document.getElementById('detail-name').textContent=display.name;document.getElementById('detail-description').textContent=display.description;document.getElementById('detail-stack').textContent=`Stack: ${display.stack}`;document.getElementById('detail-weight').textContent=`Weight: ${display.weight}`;
      document.getElementById('equip-button').disabled=!selected?.fits;
    }
    function render() {
      const grid=document.getElementById('item-grid'); grid.innerHTML='';
      const visible=items.filter(item=>![...equipped.values()].includes(item));
      for(let i=0;i<32;i++) {
        const item=visible[i]; const cell=document.createElement('div'); cell.className='item-cell'+(item===selected?' selected':'');
        if(item){cell.dataset.kind=item.kind;cell.dataset.name=item.name;cell.title=item.name;cell.innerHTML=`${use(item.kind,'item-symbol')}<span class="stack">${item.stack>1?item.stack:''}</span>`;cell.draggable=!!item.fits;
          cell.addEventListener('click',()=>{selected=item;document.querySelectorAll('.item-cell').forEach(x=>x.classList.toggle('selected',x.dataset.name===item.name));updateDetails();});
          cell.addEventListener('dblclick',()=>{if(item.fits){const target=[...document.querySelectorAll('.equip-slot')].find(el=>item.fits.includes(el.dataset.slot));if(target)equip(item,target);}else showHint(`${item.name} selected`);});
          cell.addEventListener('dragstart',e=>{dragged=item;cell.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',item.name);});
          cell.addEventListener('dragend',()=>{dragged=null;cell.classList.remove('dragging');document.querySelectorAll('.drop-ok').forEach(el=>el.classList.remove('drop-ok'));});
        }
        grid.append(cell);
      }
      document.querySelectorAll('.equip-slot').forEach(slot=>{slot.classList.toggle('filled',equipped.has(slot));slot.querySelector('.equipped-icon')?.remove();const item=equipped.get(slot);if(item){const icon=document.createElementNS('http://www.w3.org/2000/svg','svg');icon.setAttribute('class','equipped-icon');icon.setAttribute('viewBox','0 0 32 32');const glyph=document.createElementNS('http://www.w3.org/2000/svg','use');glyph.setAttribute('href',`#${item.kind}`);icon.append(glyph);slot.append(icon);} });
      updateDetails();document.getElementById('item-count').textContent=`◆ ${visible.length} / 32`;
    }
    document.getElementById('equip-button').addEventListener('click',()=>{if(selected?.fits){const target=[...document.querySelectorAll('.equip-slot')].find(el=>selected.fits.includes(el.dataset.slot));if(target)equip(selected,target);} });
    document.getElementById('drop-button').addEventListener('click',()=>showHint('Preview only — no game items are changed'));
    document.querySelector('.close').addEventListener('click',()=>showHint('Preview only — this is a design page'));
    render();
  </script>
</body>
</html>
